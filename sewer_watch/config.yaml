name: Sewer Watch
version: "1.1.1"
slug: sewer_watch
description: >-
  Watches Spencer County KY Fiscal Court agendas, minutes and notices,
  reads every PDF (with OCR for scans) and alerts you to sewer / Top Flight /
  Shelbyville Rd mentions with links to the source.
url: https://spencercountyky.gov/nav/meeting_minutes.php
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:pipe-leak
panel_title: Sewer Watch
options:
  check_interval_minutes: 180
  backfill_months: 12
  ocr: true
  notify_every_new_document: true
  meeting_day_reminder: true
  keywords:
    - sewer
    - sanitation
    - top flight
    - topflight
    - wastewater
    - package plant
    - treatment plant
    - force main
    - pump station
    - lift station
    - grinder pump
    - tap fee
    - 24KGS137
    - kentucky infrastructure authority
    - MSD
    - appraisal
    - easement
    - shelbyville rd
    - shelbyville road
    - ky 55
    - hwy 55
    - highway 55
    - KPDES
    - division of water
  extra_pages: []
schema:
  check_interval_minutes: int(30,1440)
  backfill_months: int(0,180)
  ocr: bool
  notify_every_new_document: bool
  meeting_day_reminder: bool
  keywords:
    - str
  extra_pages:
    - url
